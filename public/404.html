<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c11" />
  <meta name="robots" content="noindex" />
  <title>404 — DIKACODE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23050507'/%3E%3Crect x='6' y='6' width='88' height='88' fill='none' stroke='%23ffe600' stroke-width='8'/%3E%3Ctext x='50' y='72' font-size='60' font-weight='900' font-family='Arial' text-anchor='middle' fill='%23ffe600'%3ED%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("dika-theme");
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <style>
    :root { color-scheme: dark; --panel:#0a0c11; --card:#12151d; --line:#222735; --fog:#eef0f6; --mute:#a3a9b8; --ink:#0a0a0a; --shadow:#ffe600; }
    [data-theme="light"] { color-scheme: light; --panel:#ffffff; --card:#ffffff; --line:#d6d5de; --fog:#000000; --mute:#4f4f5c; --shadow:#000000; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: var(--panel);
      background-image: radial-gradient(rgba(196, 212, 255, 0.16) 1.2px, transparent 1.2px);
      background-size: 22px 22px;
      color: var(--fog);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      text-align: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .card {
      position: relative;
      max-width: 520px;
      width: 100%;
      padding: 48px 28px;
      border: 3px solid var(--fog);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 8px 8px 0 0 var(--shadow);
    }
    .code { font-family: 'Archivo Black', sans-serif; font-size: clamp(72px, 18vw, 128px); line-height: 1; color: #22d3ee; text-shadow: 0 0 24px rgba(34,211,238,.5); }
    .tag { display: inline-block; margin-top: 8px; padding: 4px 12px; background: #ffe600; color: #0a0a0a; border: 3px solid var(--fog); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }
    h1 { margin-top: 20px; font-family: 'Archivo Black', sans-serif; font-size: clamp(22px, 5vw, 34px); line-height: 1.1; }
    p { margin-top: 12px; color: var(--mute); font-size: 15px; font-weight: 500; line-height: 1.6; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; }
    .links a {
      text-decoration: none;
      padding: 12px 20px;
      border: 3px solid var(--fog);
      border-radius: 10px;
      font-family: 'Archivo Black', sans-serif;
      font-size: 14px;
      font-weight: 400;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .links a.primary { background: #22d3ee; color: #0a0a0a; box-shadow: 6px 6px 0 0 var(--shadow); }
    .links a.secondary { background: var(--card); color: var(--fog); box-shadow: 4px 4px 0 0 rgba(0,0,0,.5); }
    .links a:hover { transform: translate(-2px,-2px); }
    .links a.primary:hover { box-shadow: 8px 8px 0 0 var(--shadow); }
    .links a.secondary:hover { box-shadow: 6px 6px 0 0 var(--shadow); }
    .mono { margin-top: 24px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--mute); }
    :where(a):focus-visible { outline: 3px solid #ffe600; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: 0s !important; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <div class="tag">// PAGE_NOT_FOUND</div>
    <h1>HALAMAN GAK ADA BOSS</h1>
    <p>
      Halaman yang kamu cari nggak ketemu — mungkin salah path, atau emang udah dihapus.
      Balik aja ke tempat yang bener.
    </p>
    <div class="links">
      <a class="primary" href="/">← KEMBALI KE HOME</a>
      <a class="secondary" href="/layanan">LIHAT LAYANAN</a>
    </div>
    <div class="mono">DIKACODE · DIGITAL SOLUTION &amp; CODE</div>
  </div>
</body>
</html>
